<!-- BOTÃO FLUTUANTE -->
<div id="feedback-fab" aria-label="Enviar feedback"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>

<!-- MODAL FEEDBACK -->
<div id="feedback-modal" class="hidden">
  <div class="feedback-card">
    
    <!-- FECHAR -->
    <button id="feedback-close" aria-label="Fechar"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>

    <!-- TÍTULO + PONTO ONLINE -->
    <h3 class="feedback-title">
      Feedback do CheckInfra
      <span class="status-dot" aria-label="Sistema ativo"></span>
    </h3>

    <!-- INSTRUÇÃO -->
    <p>
      O CheckInfra está em fase de testes e aprimoramento.
      Sua avaliação contribui para a melhoria da metodologia
      e da experiência do sistema.
    </p>

    <!-- FORMULÁRIO -->
    <form id="feedback-form">
      <!-- URL da página automaticamente -->
      <input type="hidden" name="page_url" id="page-url">

      <!-- AVALIAÇÃO GERAL -->
      <label><strong>Avaliação geral</strong></label>
      <div class="rating">
        <label>
          <input type="radio" name="rating" value="Confusa" required>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          <span>Confusa</span>
        </label>
        <label>
          <input type="radio" name="rating" value="Regular">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="8" y1="15" x2="16" y2="15"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          <span>Regular</span>
        </label>
        <label>
          <input type="radio" name="rating" value="Boa">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          <span>Boa</span>
        </label>
        <label>
          <input type="radio" name="rating" value="Muito boa">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 13s1.5 3 4 3 4-3 4-3"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          <span>Muito boa</span>
        </label>
        <label>
          <input type="radio" name="rating" value="Excelente">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 13s1.5 3 4 3 4-3 4-3"/><path d="M9 9l.5-.5.5.5"/><path d="M15 9l.5-.5.5.5"/></svg>
          <span>Excelente</span>
        </label>
      </div>

      <!-- COMENTÁRIO OPCIONAL -->
      <label><strong>Comentário (opcional)</strong></label>
      <textarea
        name="message"
        rows="4"
        placeholder="Sugestões, observações ou pontos de melhoria…"></textarea>

      <!-- NOME OPCIONAL -->
      <label><strong>Nome (opcional)</strong></label>
      <input type="text" name="name" placeholder="Anônimo">

      <!-- BOTÃO ENVIAR -->
      <button type="submit" id="feedback-submit">Enviar feedback</button>

      <!-- MENSAGEM DE STATUS -->
      <div id="feedback-status" class="hidden"></div>
    </form>
  </div>
</div>
